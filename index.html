<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Visual SQL Builder</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }

    #blocklyDiv {
      height: 500px;
      width: 100%;
    }

    #codeOutput, #optimizedOutput {
      background: #1e1e1e;
      color: #0f0;
      padding: 15px;
      font-family: monospace;
      white-space: pre-wrap;
      min-height: 100px;
    }

    #errorOutput {
      background: #ebebeb;
      color: red;
      padding: 15px;
      font-family: monospace;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>Visual SQL Query Builder</h2>
  <div id="blocklyDiv"></div>
  <div style="display: flex; gap: 20px; margin-top: 20px;">
    <div style="flex: 1;">
      <h3 style="margin-top: 0;">Original Query</h3>
      <div id="codeOutput">Code will appear here...</div>
    </div>
    <div style="flex: 1;">
      <h3 style="margin-top: 0;">Optimized Query</h3>
      <div id="optimizedOutput">Optimized SQL will appear here...</div>
    </div>
  </div>
  <div id="errorOutput" style="margin-top: 20px;">Errors will appear here...</div>

  <!-- Load our TypeScript file -->
  <script type="module" src="./src/main.ts"></script>
</body>

</html>
